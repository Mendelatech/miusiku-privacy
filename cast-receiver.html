<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Miusiku Cast Receiver</title>
<style>
  :root {
    --brand: #6750A4;
    --brand-dark: #21182c;
    --on-surface: #EADDFF;
    --on-surface-dim: #CAC0DB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top left, var(--brand) 0%, var(--brand-dark) 65%);
    color: var(--on-surface);
  }
  audio { display: none; }

  /* Google's TV safe-area guidance: keep meaningful content within ~5% margins. */
  .safe-area {
    position: absolute;
    inset: 5%;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 20px;
    flex: 0 0 auto;
  }
  #logo {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    flex: 0 0 auto;
    animation: spin 3s linear infinite;
    animation-play-state: paused;
  }
  #logo.spinning { animation-play-state: running; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 2.4vw;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }

  main {
    flex: 1 1 auto;
    display: flex;
    gap: 5%;
    margin-top: 4%;
    min-height: 0;
  }

  .panel {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #artworkBox {
    flex: 1 1 auto;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #artwork {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  #artworkPlaceholder {
    font-size: 6vw;
    opacity: 0.4;
  }

  #trackTitle {
    margin-top: 3%;
    font-size: 2vw;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #trackArtist {
    font-size: 1.4vw;
    color: var(--on-surface-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #lyricsBox {
    flex: 1 1 auto;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6%;
  }
  #lyricsText {
    font-size: 2.6vw;
    font-weight: 600;
    line-height: 1.4;
    transition: opacity 0.25s ease;
  }
  #lyricsText.empty {
    font-size: 1.6vw;
    font-weight: 400;
    color: var(--on-surface-dim);
    opacity: 0.6;
  }

  #idleScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #idleScreen img { width: 160px; height: 160px; border-radius: 50%; }
  #idleScreen.hidden { display: none; }
</style>
</head>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    (function () {
      'use strict';

      var mediaElement = document.getElementById('mediaElement');
      var idleScreen = document.getElementById('idleScreen');
      var logoEl = document.getElementById('logo');
      var artworkEl = document.getElementById('artwork');
      var artworkPlaceholder = document.getElementById('artworkPlaceholder');
      var titleEl = document.getElementById('trackTitle');
      var artistEl = document.getElementById('trackArtist');
      var lyricsEl = document.getElementById('lyricsText');

      var lyricCues = [];       // [{ startSec, endSec, text }]
      var currentLyricsUrl = null;
      var lyricsPollHandle = null;

      var context = cast.framework.CastReceiverContext.getInstance();
      var playerManager = context.getPlayerManager();
      playerManager.setMediaElement(mediaElement);

      function setSpinning(spinning) {
        logoEl.classList.toggle('spinning', spinning);
      }

      function showIdle(isIdle) {
        idleScreen.classList.toggle('hidden', !isIdle);
      }

      function resetLyrics() {
        lyricCues = [];
        currentLyricsUrl = null;
        lyricsEl.textContent = '♫';
        lyricsEl.classList.add('empty');
      }

      /** Minimal WebVTT cue parser - only needs start/end/text, matching exactly what
       * VttConverter.kt on the Android sender produces (HH:MM:SS.mmm --> HH:MM:SS.mmm). */
      function parseVtt(vttText) {
        var lines = vttText.split(/\r?\n/);
        var cues = [];
        var i = 0;
        function toSeconds(ts) {
          var m = ts.match(/(\d+):(\d{2}):(\d{2})\.(\d{3})/);
          if (!m) return null;
          return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000;
        }
        while (i < lines.length) {
          var line = lines[i];
          if (line.indexOf('-->') !== -1) {
            var parts = line.split('-->');
            var start = toSeconds(parts[0].trim());
            var end = toSeconds(parts[1].trim());
            var textLines = [];
            i++;
            while (i < lines.length && lines[i].trim() !== '') {
              textLines.push(lines[i]);
              i++;
            }
            if (start !== null && end !== null) {
              cues.push({ startSec: start, endSec: end, text: textLines.join('\n') });
            }
          }
          i++;
        }
        return cues;
      }

      function stopLyricsPolling() {
        if (lyricsPollHandle !== null) {
          clearInterval(lyricsPollHandle);
          lyricsPollHandle = null;
        }
      }

      function startLyricsPolling() {
        stopLyricsPolling();
        lyricsPollHandle = setInterval(updateActiveLyric, 300);
      }

      function updateActiveLyric() {
        if (lyricCues.length === 0) return;
        var t = playerManager.getCurrentTimeSec();
        var active = null;
        for (var i = 0; i < lyricCues.length; i++) {
          if (t >= lyricCues[i].startSec && t < lyricCues[i].endSec) {
            active = lyricCues[i];
            break;
          }
        }
        if (active) {
          if (lyricsEl.textContent !== active.text || lyricsEl.classList.contains('empty')) {
            lyricsEl.textContent = active.text;
            lyricsEl.classList.remove('empty');
          }
        } else if (!lyricsEl.classList.contains('empty')) {
          lyricsEl.textContent = '♫';
          lyricsEl.classList.add('empty');
        }
      }

      function loadLyricsIfNeeded(mediaInfo) {
        var tracks = (mediaInfo && mediaInfo.tracks) || [];
        var textTrack = null;
        for (var i = 0; i < tracks.length; i++) {
          if (tracks[i].type === 'TEXT') { textTrack = tracks[i]; break; }
        }
        var url = textTrack ? textTrack.trackContentId : null;
        if (url === currentLyricsUrl) return;
        resetLyrics();
        currentLyricsUrl = url;
        if (!url) return;
        fetch(url).then(function (response) {
          if (!response.ok) throw new Error('lyrics not found');
          return response.text();
        }).then(function (text) {
          if (url === currentLyricsUrl) lyricCues = parseVtt(text);
        }).catch(function () {
          // No synced lyrics for this track - lyricsEl stays on the empty/placeholder state.
        });
      }

      function refreshNowPlaying() {
        var mediaInfo = playerManager.getMediaInformation();
        showIdle(!mediaInfo);
        if (!mediaInfo) {
          stopLyricsPolling();
          return;
        }
        var metadata = mediaInfo.metadata || {};
        titleEl.textContent = metadata.title || '';
        artistEl.textContent = metadata.artist || '';
        var images = metadata.images || [];
        if (images.length > 0 && images[0].url) {
          artworkEl.src = images[0].url;
          artworkEl.style.display = 'block';
          artworkPlaceholder.style.display = 'none';
        } else {
          artworkEl.style.display = 'none';
          artworkPlaceholder.style.display = 'block';
        }
        loadLyricsIfNeeded(mediaInfo);
        startLyricsPolling();
      }

      playerManager.addEventListener(
        cast.framework.events.EventType.MEDIA_INFORMATION_CHANGED,
        refreshNowPlaying,
      );
      playerManager.addEventListener(
        cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
        refreshNowPlaying,
      );
      playerManager.addEventListener(cast.framework.events.EventType.PLAYING, function () {
        setSpinning(true);
      });
      playerManager.addEventListener(cast.framework.events.EventType.PAUSE, function () {
        setSpinning(false);
      });
      playerManager.addEventListener(cast.framework.events.EventType.ENDED, function () {
        setSpinning(false);
        stopLyricsPolling();
      });

      resetLyrics();
      showIdle(true);
      context.start();
    })();
  </script>
</body>
</html>
